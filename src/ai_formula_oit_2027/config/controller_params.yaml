/**:
  ros__parameters:
    # 1. Perception Topic Inputs
    mask_image_topic: "/aiformula_perception/object_road_detector/mask_image"

    # 2. Control Topic Outputs (ai_formula_oit_2026 topic_list.yaml standard)
    cmd_vel_topic: "/aiformula_control/handle_controller/cmd_vel"
    status_topic: "/aiformula_control/lane_tracker/status"



    # 3. Visualization Outputs (ai_formula_oit_2026 standard)
    marker_topic: "/aiformula_visualization/lane_target_marker"
    path_topic: "/aiformula_visualization/target_trajectory"

    # Frame IDs (sample_vehicle standard)
    robot_frame_id: "base_link"

    # Camera & BEV Physical Projection Geometry (ZED X sample_vehicle calibrated)
    camera_height: 0.56
    dist_min: 1.15
    dist_max: 10.0
    lateral_max: 5.0
    lane_width: 3.5

    # 2-Point Anchor Control (Origin Anchor + 5.0m Preview Anchor)
    lookahead_distance: 5.0
    target_linear_speed: 1.0
    angular_gain: 0.85
    cross_track_gain: 0.95
    max_angular_speed: 1.5
    max_angular_accel: 4.0

    # Fallback & Rates
    data_timeout: 0.8
    control_rate_hz: 20.0
